# Builds KeySwitch.exe on every push and pull request.
# A tag like v1.2.3 creates a GitHub Release with the exe attached.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build
        working-directory: src
        run: |
          x86_64-w64-mingw32-windres keyswitch.rc -O coff -o keyswitch_res.o
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -s -Wall -Wextra -municode -mwindows -static \
            keyswitch.cpp keyswitch_res.o -o KeySwitch.exe \
            -luser32 -lshell32 -ladvapi32 -lgdi32 -lwinmm -lcomdlg32 -lgdiplus -lole32
          sha256sum KeySwitch.exe | tee KeySwitch.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeySwitch
          path: |
            src/KeySwitch.exe
            src/KeySwitch.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KeySwitch ${{ github.ref_name }}
          body: |
            Download `KeySwitch.exe` and run it. No installation needed.
            Скачайте `KeySwitch.exe` и запустите. Установка не нужна.

            What's new: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            Built automatically from commit ${{ github.sha }}.
          files: |
            src/KeySwitch.exe
            src/KeySwitch.exe.sha256
